name: Deploy Ostad Edu Open API

on:
  push:
    branches:
      - open-api
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      APP_DIR: /home/azureuser/apps/ostad-edu

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/package.json"

      - name: Sync code to production directory
        run: |
          mkdir -p "$APP_DIR"

          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'node_modules' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install

      - name: Restart backend
        run: |
          cd "$APP_DIR"
          pm2 restart ostad-open-api || pm2 start npm --name ostad-open-api -- start
          pm2 save