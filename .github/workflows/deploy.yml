name: Deploy Ostad Edu Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      APP_DIR: /home/azureuser/apps/ostad-edu/mern/backend/open-api
      SOURCE_DIR: mern/backend/open-api

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Debug structure
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -maxdepth 5 -name package.json -print

      - name: Sync open-api only
        run: |
          mkdir -p "$APP_DIR"

          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'node_modules' \
            "$GITHUB_WORKSPACE/$SOURCE_DIR/" "$APP_DIR/"

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          ls -la
          npm install

      - name: Restart backend
        run: |
          cd "$APP_DIR"
          pm2 restart ostad-open-api || pm2 start npm --name ostad-open-api -- start
          pm2 save